<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Dopplor</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="black">
    <video id="camera" playsinline muted></video>
    <img id="preview" alt="" />
    <canvas id="overlay"></canvas>

    <div id="status">Démarrage…</div>

    <aside id="hud">
      <div class="row"><span>Fond</span><b id="hud-bg">–</b></div>
      <div class="row"><span>Source</span><b id="hud-source">–</b></div>
      <div class="row"><span>Caméra</span><b id="hud-camera">–</b></div>
      <div class="row"><span>GPU</span><b id="hud-gpu">–</b></div>
      <div class="row"><span>Rendu</span><b id="hud-render">–</b></div>
      <div class="row"><span>Latence</span><b id="hud-latency">–</b></div>
      <div class="row"><span>Prédiction</span><b id="hud-prediction">–</b></div>
      <div class="row"><span>Corps</span><b id="hud-pose">–</b></div>
      <div class="row"><span>Mains</span><b id="hud-hands">–</b></div>
      <div class="row"><span>Visage</span><b id="hud-face">–</b></div>
      <div class="row"><span>Expression</span><b id="hud-expression">–</b></div>
      <div class="keys">
        <div><kbd>C</kbd> écran noir / flux caméra</div>
        <div><kbd>1</kbd> corps · <kbd>2</kbd> mains · <kbd>3</kbd> visage</div>
        <div><kbd>P</kbd> modèle corps lite / full / heavy</div>
        <div><kbd>↑</kbd><kbd>↓</kbd> prédiction (compense la latence)</div>
        <div><kbd>F</kbd> plein écran · <kbd>H</kbd> masquer ce panneau</div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
